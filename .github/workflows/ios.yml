name: iOS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: brew install meson ninja cmake pkg-config
      - name: Cache gfxstream + MoltenVK
        uses: actions/cache@v4
        with:
          path: build/gfx-ios/out
          key: gfx-ios-${{ hashFiles('tools/build-gfxstream.sh', 'tools/build-gfxstream-ios.sh', 'tools/gfxstream-*.py') }}
      - run: tools/build-gfxstream-ios.sh
      - run: ios/build-ipa.sh
        env:
          REQUIRE_GFXSTREAM: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: indroid.ipa
          path: build/indroid.ipa
          if-no-files-found: error
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/indroid.ipa
