[package]
name = "indroid-kernel"
description = "Linux user-space ABI emulation for indroid neo (boots AOSP userspace on indroid-a64)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
indroid-a64 = { path = "../a64" }
indroid-aot = { path = "../aot" }
parking_lot = "0.12"
libc = "0.2"
regex = { version = "1.9", default-features = false, features = ["std", "perf", "unicode-perl"] }
