[workspace]
resolver = "2"
members = ["crates/aot", "crates/a64", "crates/rom", "crates/kernel", "crates/gpu", "crates/dex", "crates/vm", "crates/apk", "crates/ffi", "crates/cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/flyingsquirrel0419/indroid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-ffi]
inherits = "release"
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = true
strip = false

# Optimized build that compiles quickly (neo boot experiments).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
panic = "unwind"

# The CPU interpreter and kernel are far too slow unoptimized (tests boot real
# guest programs).
[profile.dev.package.indroid-a64]
opt-level = 3
[profile.dev.package.indroid-kernel]
opt-level = 2
